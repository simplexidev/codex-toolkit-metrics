name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore CodexToolkit.Metrics.slnx
      - run: dotnet build CodexToolkit.Metrics.slnx --no-restore
      - run: dotnet test CodexToolkit.Metrics.slnx --no-build --logger trx --results-directory TestResults
      - run: dotnet run --project src/CodexToolkit.Metrics --no-build -- validate-evaluation tests/CodexToolkit.Metrics.Tests/Fixtures/evaluation-valid-v1.json
      - run: dotnet run --project src/CodexToolkit.Metrics --no-build -- validate-calibration scenarios/judge-calibration-v1.json
      - run: dotnet run --project src/CodexToolkit.Metrics --no-build -- validate-public data/public/example-summary.json
      - run: dotnet run --project src/CodexToolkit.Metrics --no-build -- dashboard-check dashboard
      - run: dotnet run --project src/CodexToolkit.Metrics --no-build -- publish-pages dashboard data/public _pages-ci
      - run: dotnet format CodexToolkit.Metrics.slnx --no-restore --verify-no-changes
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: TestResults
          retention-days: 7
